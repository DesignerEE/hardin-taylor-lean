<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" width="820" height="350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24292f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="350" fill="#ffffff"/>

  <text x="24" y="32" font-size="19" font-weight="bold" fill="#24292f">Why a well-ordered set of times is small</text>
  <text x="24" y="56" font-size="13" fill="#57606a">A well-ordered set E of times is a chain: every point except the largest has an immediate successor.</text>
  <text x="24" y="76" font-size="13" fill="#57606a">So the points are separated by open gaps (x, next(x)), and each gap contains no points of E.</text>

  <!-- time axis -->
  <line x1="70" y1="200" x2="775" y2="200" stroke="#24292f" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="716" y="228" font-size="15" fill="#24292f">time &#x211d;</text>

  <!-- successor gaps -->
  <rect x="149" y="191" width="122" height="18" fill="#ddf4ff"/>
  <rect x="289" y="191" width="122" height="18" fill="#ddf4ff"/>
  <rect x="429" y="191" width="122" height="18" fill="#ddf4ff"/>
  <rect x="569" y="191" width="122" height="18" fill="#ddf4ff"/>

  <!-- points of E -->
  <circle cx="140" cy="200" r="7" fill="#cf222e"/>
  <circle cx="280" cy="200" r="7" fill="#cf222e"/>
  <circle cx="420" cy="200" r="7" fill="#cf222e"/>
  <circle cx="560" cy="200" r="7" fill="#cf222e"/>
  <circle cx="700" cy="200" r="7" fill="#cf222e"/>
  <text x="131" y="232" font-size="14" fill="#24292f">x1</text>
  <text x="271" y="232" font-size="14" fill="#24292f">x2</text>
  <text x="411" y="232" font-size="14" fill="#24292f">x3</text>
  <text x="551" y="232" font-size="14" fill="#24292f">x4</text>
  <text x="691" y="232" font-size="14" fill="#24292f">x5</text>

  <!-- one rational per gap -->
  <circle cx="210" cy="200" r="5" fill="#1a7f37"/>
  <circle cx="350" cy="200" r="5" fill="#1a7f37"/>
  <circle cx="490" cy="200" r="5" fill="#1a7f37"/>
  <circle cx="630" cy="200" r="5" fill="#1a7f37"/>
  <text x="203" y="180" font-size="13" fill="#1a7f37">q1</text>
  <text x="343" y="180" font-size="13" fill="#1a7f37">q2</text>
  <text x="483" y="180" font-size="13" fill="#1a7f37">q3</text>
  <text x="623" y="180" font-size="13" fill="#1a7f37">q4</text>

  <!-- annotations -->
  <text x="152" y="258" font-size="12" fill="#57606a">(x1, next(x1)) &#8212; open gap, no points of E</text>
  <text x="152" y="152" font-size="12" fill="#1a7f37">q1 &#8712; &#x211a; sits inside the gap</text>
  <text x="620" y="258" font-size="12" fill="#57606a">(schematic)</text>

  <!-- takeaway -->
  <text x="24" y="300" font-size="12" fill="#24292f">each gap holds a rational q_x; the gaps are disjoint, so the rationals are distinct  &#x27f9;  E is countable</text>
  <text x="24" y="324" font-size="12" fill="#24292f">each gap is also free of the closure of E  &#x27f9;  E is nowhere dense (no interval survives)</text>
</svg>
