<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24292f"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="380" fill="#ffffff"/>

  <text x="24" y="32" font-size="19" font-weight="bold" fill="#24292f">Failure times strictly climb the well-order</text>
  <text x="24" y="56" font-size="13" fill="#57606a">Red X marks a wrong prediction. Take two failure times s &lt; t and compare the chosen candidates g_s, g_t.</text>
  <text x="24" y="76" font-size="13" fill="#57606a">The map t &#x21a6; g_t is strictly increasing from the failure set into the well-order r.</text>

  <!-- time axis -->
  <line x1="70" y1="250" x2="445" y2="250" stroke="#24292f" stroke-width="2" marker-end="url(#arrb)"/>
  <text x="392" y="276" font-size="15" fill="#24292f">time &#x211d;</text>

  <!-- failure points -->
  <circle cx="170" cy="250" r="7" fill="#cf222e"/>
  <circle cx="330" cy="250" r="7" fill="#cf222e"/>
  <text x="163" y="278" font-size="16" fill="#24292f">s</text>
  <text x="323" y="278" font-size="16" fill="#24292f">t</text>
  <path d="M 163 222 L 177 236 M 177 222 L 163 236" stroke="#cf222e" stroke-width="2.5"/>
  <path d="M 323 222 L 337 236 M 337 222 L 323 236" stroke="#cf222e" stroke-width="2.5"/>
  <text x="228" y="310" font-size="15" fill="#57606a">s &lt; t</text>

  <!-- well-order axis -->
  <line x1="620" y1="265" x2="620" y2="90" stroke="#24292f" stroke-width="2" marker-end="url(#arrb)"/>
  <text x="634" y="97" font-size="15" fill="#24292f">well-order r</text>
  <text x="634" y="115" font-size="12" fill="#57606a">least at the bottom</text>

  <!-- candidates -->
  <circle cx="620" cy="210" r="7" fill="#0969da"/>
  <circle cx="620" cy="140" r="7" fill="#0969da"/>
  <text x="634" y="215" font-size="15" fill="#24292f">g_s</text>
  <text x="634" y="145" font-size="15" fill="#24292f">g_t</text>

  <!-- history-to-candidate curves -->
  <path d="M 178 245 Q 350 232 606 211" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M 338 243 Q 470 192 606 147" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="232" y="226" font-size="13" fill="#57606a">s &#x21a6; g_s</text>
  <text x="452" y="178" font-size="13" fill="#57606a">t &#x21a6; g_t</text>

  <!-- strict climb -->
  <line x1="672" y1="205" x2="672" y2="147" stroke="#cf222e" stroke-width="2" marker-end="url(#arrr)"/>
  <text x="682" y="172" font-size="12" fill="#cf222e">strictly</text>
  <text x="682" y="188" font-size="12" fill="#cf222e">higher in r</text>

  <!-- legend and takeaway -->
  <text x="24" y="330" font-size="12" fill="#57606a">red X = the prediction at that time is wrong</text>
  <text x="24" y="352" font-size="12" fill="#24292f">s &lt; t  &#x27f9;  g_s is strictly below g_t in r  &#x27f9;  the failure set is a well-ordered subset of &#x211d;  &#x27f9;  countable and nowhere dense</text>
</svg>
